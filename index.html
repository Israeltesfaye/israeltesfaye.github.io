<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Israel Tesfaye | Full Stack Developer</title>
  <meta name="description" content="Terminal portfolio of Israel Tesfaye, a full-stack developer skilled in JavaScript, MERN stack, and web technologies." />
  <meta name="keywords" content="Israel Tesfaye, full stack developer, MERN, JavaScript, portfolio, web development" />
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="terminal">
    <div class="terminal-header">
      <span class="terminal-title">israel@portfolio:~</span>
      <span class="terminal-time" id="terminal-time"></span>
    </div>
    
    <div class="terminal-body" id="terminal-body">
      <div class="output" id="output"></div>
      
      <div class="input-line">
        <span class="prompt">israel@portfolio:~$</span>
        <input type="text" id="command-input" autocomplete="off" spellcheck="false" autofocus>
        <span class="cursor" id="cursor"></span>
      </div>
    </div>
  </div>

  <script src="main.js"></script>
</body>
</html>
